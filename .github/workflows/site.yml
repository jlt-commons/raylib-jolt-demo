name: Site

# Builds the documentation site on every pull request, and publishes it to
# GitHub Pages from main, at https://jlt-commons.github.io/raylib-jolt-demo/.
#
# The build lives in jlt-commons/ci-builds, shared by every project. What stays
# here is this project's own: the content under docs/, its config in
# docs/site.edn, the base path below, and the assertions in docs/check-site.sh.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A half-applied Pages deployment is worse than a slightly stale one, so main is
# never cancelled. Pull request builds cancel their own earlier runs.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  site:
    uses: jlt-commons/ci-builds/.github/workflows/site.yml@main
    with:
      base-path: /raylib-jolt-demo
      docs-engine-ref: v0.3.2
    permissions:
      contents: read
      pages: write
      id-token: write
