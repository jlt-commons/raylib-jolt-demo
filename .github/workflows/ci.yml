name: CI

# ---------------------------------------------------------------------------
# Runs on pull requests and pushes to main, plus manual dispatch.
#
# The raylib bindings arrive as a git dependency, pinned by :git/sha in
# common/deps.edn, so jolt fetches them itself. No second checkout needed.
# ---------------------------------------------------------------------------

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      jolt-version:
        description: "jolt version to install (blank = the pinned JOLT_VERSION below)"
        required: false
        default: ""

permissions:
  contents: read

env:
  # Pinned so a jolt release published overnight can't turn CI red on a tree
  # nobody touched. Bump it in its own commit. A workflow_dispatch run with the
  # jolt-version input tries a candidate without moving the pin.
  JOLT_VERSION: ${{ inputs.jolt-version || '0.8.17' }}

jobs:
  check:
    name: doctor · generated files · lint · compile every demo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      # Ubuntu's archive may or may not carry raylib 6, so try the package and
      # fall back to a pinned source build. The -dev package matters: it ships
      # the unversioned libraylib.so that :jolt/native in raylib-jlt/lib looks for.
      - name: Install libraylib
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          if sudo apt-get install -y libraylib-dev; then
            echo "installed libraylib-dev from apt"
          else
            echo "libraylib-dev unavailable, building raylib from source"
            sudo apt-get install -y --no-install-recommends \
              build-essential cmake git \
              libasound2-dev libx11-dev libxrandr-dev libxi-dev \
              libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
              libxinerama-dev libxkbcommon-dev
            git clone --depth 1 --branch "$RAYLIB_REF" https://github.com/raysan5/raylib /tmp/raylib
            cmake -S /tmp/raylib -B /tmp/raylib/build \
              -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF
            cmake --build /tmp/raylib/build -j"$(nproc)"
            sudo cmake --install /tmp/raylib/build
            sudo ldconfig
          fi
        env:
          RAYLIB_REF: "6.0"

      - uses: jlt-commons/setup-jolt@v1
        with:
          version: ${{ env.JOLT_VERSION }}

      # clj-kondo pinned to raylib-jlt's CI version, so the two repos agree on
      # what a finding is.
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: 1.12.196
          clj-kondo: "2026.05.25"

      # Also fetches the pinned raylib-jlt, so a bad :git/sha fails here.
      - name: Doctor
        run: bb doctor

      # The root deps.edn, check.clj, the per-demo tasks in bb.edn and the
      # gallery are all built from demos.edn. A demo added without `bb gen`, or
      # a demo directory missing from demos.edn, fails here.
      - name: Generated files match demos.edn
        run: |
          bb gen --check || {
            echo "::error title=generated files out of date::run bb gen and commit the result"
            exit 1
          }

      - name: clj-kondo
        run: bb lint:strict

      # Compiles every demo namespace with no window. Failure output is echoed
      # and also re-emitted as an annotation plus a job summary, readable
      # without downloading the log archive.
      - name: Compile every demo (headless)
        run: |
          set +e
          out="$(bb check 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            printf '### `bb check` failed (exit %s)\n\n```\n%s\n```\n' \
              "$rc" "$(printf '%s\n' "$out" | tail -60)" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$out" | tail -c 2000 \
              | python3 -c 'import sys; print("::error title=bb check failed::" + sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$rc"
